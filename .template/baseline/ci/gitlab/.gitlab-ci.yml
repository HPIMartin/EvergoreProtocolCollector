# ADAPT: copy to the repo root. The pipeline runs ./verify inside the devcontainer image, so a
# local run and a pipeline run execute the same commands.
stages:
  - image
  - verify
  - deploy

variables:
  DEVCONTAINER_IMAGE: "$CI_REGISTRY_IMAGE/devcontainer:latest"

default:
  interruptible: true

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

devcontainer-image:
  stage: image
  image: docker:cli
  services:
    - docker:dind
  rules:
    - changes:
        - .devcontainer/**/*
    - when: manual
      allow_failure: true
  before_script:
    - apk add --no-cache nodejs npm
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - |
      tags="--image-name $CI_REGISTRY_IMAGE/devcontainer:$CI_COMMIT_REF_SLUG"
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        tags="$tags --image-name $CI_REGISTRY_IMAGE/devcontainer:latest"
      fi
      npx --yes @devcontainers/cli build --workspace-folder . $tags --push true

verify:
  stage: verify
  image: "$DEVCONTAINER_IMAGE"
  needs:
    - job: devcontainer-image
      optional: true
  rules:
    - changes:
        - .devcontainer/**/*
      variables:
        DEVCONTAINER_IMAGE: "$CI_REGISTRY_IMAGE/devcontainer:$CI_COMMIT_REF_SLUG"
    - when: on_success
  script:
    - ./verify all
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      # ADAPT: keep the paths your stack writes. artifacts/test-results/ covers js, python, cpp and
      # csharp; the build/test-results glob covers a Gradle build.
      junit:
        - "**/artifacts/test-results/*.xml"
        - "**/build/test-results/test/TEST-*.xml"

vuln:
  stage: verify
  image: "$DEVCONTAINER_IMAGE"
  needs:
    - job: devcontainer-image
      optional: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never
    - changes:
        - .devcontainer/**/*
      variables:
        DEVCONTAINER_IMAGE: "$CI_REGISTRY_IMAGE/devcontainer:$CI_COMMIT_REF_SLUG"
    - when: on_success
  allow_failure: true
  script:
    - ./verify vuln

deploy:
  stage: deploy
  image: "$DEVCONTAINER_IMAGE"
  interruptible: false
  needs:
    - job: verify
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  script:
    # ADAPT: the deployment for this project. Deliver CI-produced artifacts, never a local build.
    - echo 'no deployment is wired for this project yet'
    - exit 1
