# Central, version-controlled build parameters (non-secret).

# Vulnerability scan (`./gradlew vulnScan`, CycloneDX SBOM analyzed by Trivy): comma-separated
# severities that FAIL the scan, e.g. CRITICAL or HIGH,CRITICAL. Absent/blank = report-only.
# The scan stays on-demand / delivery-gate territory and is never wired into `./gradlew build`.
#vulnScan.failOnSeverity=

# Single source for the Node version used by the :frontend build (node-gradle downloads this exact version).
nodeVersion=24.18.0

# Build performance. The local build cache (~/.gradle/caches/build-cache-1) is shared by every
# worktree, so a fresh worktree at an already-built commit replays compile/checkstyle/frontend
# results instead of running them cold. Parallel execution needs the raised daemon heap.
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
