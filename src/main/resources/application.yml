micronaut:
  application:
    name: Evergore Protocol Parser
  router:
    static-resources:
      swagger:
        paths: classpath:META-INF/swagger
        mapping: /swagger/**
      redoc:
        paths: classpath:META-INF/swagger/views/redoc
        mapping: /redoc/**
      rapidoc:
        paths: classpath:META-INF/swagger/views/rapidoc
        mapping: /rapidoc/**
      swagger-ui:
        paths: classpath:META-INF/swagger/views/swagger-ui
        mapping: /swagger-ui/**
      spa:
        paths: classpath:static/ui
        mapping: /**
jackson:
  serialization-inclusion: ALWAYS
  serialization:
    write-dates-as-timestamps: false
endpoints:
  health:
    enabled: true
    sensitive: false
    details-visible: ANONYMOUS
netty:
  default:
    allocator:
      max-order: 3
evergore:
  security:
    public-paths:
      - /
      - /index.html
      - /assets/**
      - /favicon.ico
      - /health
      - /swagger/**
      - /swagger-ui/**
      - /redoc/**
      - /rapidoc/**
  rate-limit:
    max-requests-per-interval: 5
    interval: 10s
    block-duration: 1m
